<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --primary: #ff8c00;
      --primary-hover: #e07b00;
      --primary-grad: linear-gradient(135deg, #ff8c00, #ffb700);
      --bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --card-bg: #f9fafb;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    body {
      width: 340px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    /* Tabs Navigation */
    .tabs {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid var(--border);
      margin-bottom: 12px;
      padding-bottom: 2px;
    }
    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -4px;
      padding: 8px 4px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: var(--primary);
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }

    .tab-pane {
      display: none;
    }
    .tab-pane.active {
      display: block;
    }

    p.site {
      font-size: 11px;
      color: var(--text-muted);
      margin: 0 0 10px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shortcut-tip {
      background: #fff8eb;
      border: 1px solid #ffe8cc;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 11px;
      color: #b45309;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button.btn-main {
      width: 100%;
      padding: 11px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: var(--primary-grad);
      color: #111;
      margin-bottom: 8px;
      box-shadow: 0 2px 6px rgba(255, 140, 0, 0.25);
      transition: transform 0.1s, opacity 0.2s;
    }
    button.btn-main:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    button.btn-main:active {
      transform: translateY(0);
    }
    button.btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    button.secondary {
      width: 100%;
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s;
    }
    button.secondary:hover {
      background: #edf0f2;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--text-muted);
      min-height: 18px;
    }
    .error { color: var(--danger); }
    .success { color: var(--success); }

    .manual-box {
      display: none;
      margin-top: 10px;
    }
    .manual-box.visible {
      display: block;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 8px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
      resize: vertical;
    }
    label {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    /* Buscador Cliente */
    .search-input-box {
      position: relative;
      margin-bottom: 10px;
    }
    .search-input-box input {
      width: 100%;
      padding: 9px 10px 9px 30px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      outline: none;
    }
    .search-input-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.15);
    }
    .search-icon {
      position: absolute;
      left: 9px;
      top: 9px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .client-list {
      max-height: 260px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .client-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      font-size: 12px;
      transition: border-color 0.2s;
    }
    .client-card:hover {
      border-color: #cbd5e1;
    }
    .client-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 4px;
    }
    .client-name {
      font-weight: 700;
      color: var(--text);
      font-size: 13px;
    }
    .client-sub {
      color: var(--text-muted);
      font-size: 11px;
      margin-bottom: 6px;
    }
    .balance-badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 11px;
    }
    .badge-ok {
      background: #d1fae5;
      color: #065f46;
    }
    .badge-limit {
      background: #fee2e2;
      color: #991b1b;
    }
    .badge-doc {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 4px;
    }
    .doc-vigente { background: #e0e7ff; color: #3730a3; }
    .doc-por_vencer { background: #fef3c7; color: #92400e; }
    .doc-vencido { background: #fee2e2; color: #991b1b; }

    .btn-send-fast {
      display: inline-block;
      width: 100%;
      margin-top: 6px;
      padding: 5px;
      background: #eef2ff;
      color: #3730a3;
      border: 1px solid #c7d2fe;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn-send-fast:hover {
      background: #e0e7ff;
    }

    /* Configuración */
    .config-box {
      display: none;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .config-box.visible {
      display: block;
    }
    .config-box input {
      width: 100%;
      padding: 7px;
      font-size: 11px;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-sizing: border-box;
    }
    .config-msg {
      font-size: 11px;
      margin-top: 6px;
      min-height: 14px;
    }
    button.link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: normal;
      font-size: 11px;
      padding: 4px 0;
      cursor: pointer;
      text-decoration: underline;
      display: block;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Navegación por pestañas -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="tabRecibo">⚡ Recibo</button>
    <button class="tab-btn" data-tab="tabCliente">🔍 Consultar Saldo</button>
  </div>

  <!-- PESTAÑA 1: RECIBO -->
  <div id="tabRecibo" class="tab-pane active">
    <p class="site">
      <span>Portal: <strong id="site">...</strong></span>
    </p>

    <div class="shortcut-tip">
      <span>💡 Atajo: <strong>Alt + R</strong> o botón ⚡ flotante</span>
    </div>

    <button id="btnEnviar" class="btn-main">📋 Enviar recibo automático</button>
    <button id="btnToggleManual" class="secondary">✏️ Pegar recibo manualmente</button>

    <div id="manualBox" class="manual-box">
      <label for="manualText">Texto del recibo:</label>
      <textarea id="manualText" placeholder="Mittente: JUAN PEREZ&#10;Importo: 500,00 EUR&#10;MTCN: 1234567890..."></textarea>
      <button id="btnEnviarManual" class="btn-main" style="margin-top:6px;">📤 Procesar texto</button>
    </div>

    <div id="status"></div>
  </div>

  <!-- PESTAÑA 2: CONSULTAR CLIENTE -->
  <div id="tabCliente" class="tab-pane">
    <div class="search-input-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="inputBuscarCliente" placeholder="Buscar por documento o nombre..." autofocus>
    </div>
    <div id="statusCliente" style="font-size:11px; color:var(--text-muted); margin-bottom:6px; min-height:14px;"></div>
    <div id="listaClientes" class="client-list">
      <div style="text-align: center; color: var(--text-muted); font-size: 12px; padding: 20px 0;">
        Escribe 2 o más letras o números para consultar el límite semanal y documentos.
      </div>
    </div>
  </div>

  <!-- Footer con Configuración -->
  <button id="btnToggleConfig" class="link">⚙️ Configurar URL del sistema</button>
  <div id="configBox" class="config-box">
    <label for="configUrl">URL de tu negocio:</label>
    <input type="text" id="configUrl" placeholder="https://tu-negocio.up.railway.app">
    <button id="btnGuardarConfig" class="secondary" style="margin-top:6px;">💾 Guardar URL</button>
    <div id="configMsg" class="config-msg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
