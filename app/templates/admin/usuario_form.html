{% extends 'base.html' %}

{% block title %}Nuevo usuario - Administración{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="my-0"><i class="fas fa-user-plus me-2"></i>Nuevo usuario</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('admin.usuario_nuevo') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre"
                                   value="{{ datos.get('nombre', '') }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input type="text" class="form-control" id="apellido" name="apellido"
                                   value="{{ datos.get('apellido', '') }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="username" class="form-label">Nombre de usuario *</label>
                        <input type="text" class="form-control" id="username" name="username"
                               value="{{ datos.get('username', '') }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" name="email"
                               value="{{ datos.get('email', '') }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña *</label>
                        <input type="password" class="form-control" id="password" name="password"
                               minlength="8" required>
                        <div class="form-text">Mínimo 8 caracteres. El usuario podrá cambiarla desde su perfil.</div>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="is_admin" name="is_admin"
                               {% if datos.get('is_admin') %}checked{% endif %}>
                        <label class="form-check-label" for="is_admin">
                            Administrador del negocio (puede gestionar servicios, datos y usuarios)
                        </label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i>Crear usuario
                        </button>
                        <a href="{{ url_for('admin.usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
